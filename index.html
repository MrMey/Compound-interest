<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur d'Intérêts Composés avec Frais</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #166534;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --gray-text: #475569;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 992px) {
            .grid {
                grid-template-columns: 1fr 2fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .results-container {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 480px) {
            .results-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .result-box {
            padding: 14px;
            border-radius: 8px;
            text-align: center;
        }

        .result-box.with-fees {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
        }

        .result-box.no-fees {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        .result-box h3 {
            margin: 0 0 6px 0;
            font-size: 0.9rem;
            color: var(--gray-text);
        }

        .result-box.with-fees h3 {
            color: var(--success);
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .result-box.with-fees .result-value {
            color: #15803d;
        }

        .result-box.no-fees .result-value {
            color: #334155;
        }

        .chart-container {
            position: relative;
            height: 100%;
            min-height: 450px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulateur d'Intérêts Composés avec Frais</h1>
    
    <div class="grid">
        <div class="card">
            <div class="section-title">Paramètres du Placement</div>
            
            <div class="form-group">
                <label for="principal">Capital Initial (P) en € :</label>
                <input type="number" id="principal" value="10000" min="0" step="500">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="rate">Taux annuel (r) en % :</label>
                    <input type="number" id="rate" value="6" min="0" step="0.1">
                </div>

                <div class="form-group">
                    <label for="years">Durée (t) en années :</label>
                    <input type="number" id="years" value="10" min="1" step="1">
                </div>
            </div>

            <div class="form-group">
                <label for="compounding">Fréquence de capitalisation (n) :</label>
                <select id="compounding">
                    <option value="1" selected>Annuelle (1/an)</option>
                    <option value="2">Semestrielle (2/an)</option>
                    <option value="4">Trimestrielle (4/an)</option>
                    <option value="12">Mensuelle (12/an)</option>
                </select>
            </div>

            <div class="section-title" style="margin-top: 25px;">Frais</div>

            <div class="form-group">
                <label for="entryFee">Frais d'entrée (e) en % :</label>
                <input type="number" id="entryFee" value="1" min="0" max="100" step="0.1">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="custodyFee">Frais de garde (g) par an en % :</label>
                    <input type="number" id="custodyFee" value="0.5" min="0" max="100" step="0.1">
                </div>

                <div class="form-group">
                    <label for="exitFee">Frais de sortie (s) en % :</label>
                    <input type="number" id="exitFee" value="2" min="0" max="100" step="0.1">
                </div>
            </div>

            <button onclick="calculerInterets()">Calculer et Comparer</button>

            <div class="results-container">
                <div class="result-box with-fees">
                    <h3>Capital Final (Net) :</h3>
                    <div id="result-with-fees" class="result-value">0,00 €</div>
                </div>
                <div class="result-box no-fees">
                    <h3>Capital Sans Frais :</h3>
                    <div id="result-no-fees" class="result-value">0,00 €</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="chart-container">
                <canvas id="interestChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    let myChart = null;

    function calculerInterets() {
        // Récupération et conversion des entrées
        const P = parseFloat(document.getElementById('principal').value) || 0;
        const r = (parseFloat(document.getElementById('rate').value) || 0) / 100;
        const n = parseInt(document.getElementById('compounding').value);
        const t = parseInt(document.getElementById('years').value) || 0;

        const e = (parseFloat(document.getElementById('entryFee').value) || 0) / 100;
        const g = (parseFloat(document.getElementById('custodyFee').value) || 0) / 100;
        const s = (parseFloat(document.getElementById('exitFee').value) || 0) / 100;

        const labels = [];
        const dataWithFees = [];
        const dataNoFees = [];

        // Formatage pour l'affichage des devises
        const currencyFormatter = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });

        for (let i = 0; i <= t; i++) {
            labels.push(`Année ${i}`);

            // 1. Calcul SANS frais : A = P * (1 + r/n)^(n*i)
            const A_no_fees = P * Math.pow((1 + r / n), (n * i));
            dataNoFees.push(A_no_fees.toFixed(2));

            // 2. Calcul AVEC frais
            // Étape a : Application des frais d'entrée uniquement sur le capital initial
            const capitalInitialNet = P * (1 - e);
            
            // Étape b : Capitalisation avec impact des frais de garde (r - g)
            let A_with_fees = capitalInitialNet * Math.pow((1 + (r - g) / n), (n * i));
            
            // Étape c : Application des frais de sortie (simulée sur l'année i actuelle)
            if (i > 0) {
                A_with_fees = A_with_fees * (1 - s);
            } else {
                // À l'année 0, si on retire immédiatement
                A_with_fees = capitalInitialNet * (1 - s);
            }
            
            dataWithFees.push(A_with_fees.toFixed(2));
        }

        // Affichage des
