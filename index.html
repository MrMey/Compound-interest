<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur d'Intérêts Composés</title>
    <!-- Intégration de Chart.js pour le graphique -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 2fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            text-align: center;
        }

        .result-box h3 {
            margin: 0 0 8px 0;
            color: #166534;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #15803d;
        }

        .chart-container {
            position: relative;
            height: 100%;
            min-height: 350px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulateur d'Intérêts Composés</h1>
    
    <div class="grid">
        <!-- Formulaire de saisie -->
        <div class="card">
            <div class="form-group">
                <label for="principal">Capital Initial (P) en € :</label>
                <input type="number" id="principal" value="1000" min="0" step="100">
            </div>

            <div class="form-group">
                <label for="rate">Taux d'intérêt annuel (r) en % :</label>
                <input type="number" id="rate" value="5" min="0" step="0.1">
            </div>

            <div class="form-group">
                <label for="compounding">Fréquence de capitalisation (n) :</label>
                <select id="compounding">
                    <option value="1">Annuelle (1/an)</option>
                    <option value="2">Semestrielle (2/an)</option>
                    <option value="4">Trimestrielle (4/an)</option>
                    <option value="12" selected>Mensuelle (12/an)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="years">Durée (t) en années :</label>
                <input type="number" id="years" value="10" min="1" step="1">
            </div>

            <button onclick="calculerInterets()">Calculer et tracer</button>

            <div class="result-box">
                <h3>Capital Final à t :</h3>
                <div id="final-result" class="result-value">0,00 €</div>
            </div>
        </div>

        <!-- Graphique -->
        <div class="card">
            <div class="chart-container">
                <canvas id="interestChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // Variable globale pour stocker l'instance du graphique Chart.js
    let myChart = null;

    function calculerInterets() {
        // Récupération des valeurs des inputs
        const P = parseFloat(document.getElementById('principal').value) || 0;
        const r = (parseFloat(document.getElementById('rate').value) || 0) / 100;
        const n = parseInt(document.getElementById('compounding').value);
        const t = parseInt(document.getElementById('years').value) || 0;

        const labels = [];
        const dataCapital = [];

        // Boucle pour calculer la valeur pour chaque année de 0 à t
        for (let i = 0; i <= t; i++) {
            labels.push(`Année ${i}`);
            
            // Formule des intérêts composés : A = P * (1 + r/n)^(n*t)
            const A = P * Math.pow((1 + r / n), (n * i));
            dataCapital.push(A.toFixed(2));
        }

        // Affichage du résultat final (dernier élément du tableau)
        const capitalFinal = dataCapital[dataCapital.length - 1];
        document.getElementById('final-result').textContent = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(capitalFinal);

        // Mise à jour ou création du graphique
        const ctx = document.getElementById('interestChart').getContext('2d');
        
        // Si le graphique existe déjà, on le détruit avant de le recréer pour éviter les superpositions au survol
        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Évolution du Capital (€)',
                    data: dataCapital,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        title: {
                            display: true,
                            text: 'Montant (€)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Temps (Années)'
                        }
                    }
                }
            }
        });
    }

    // Premier calcul automatique au chargement de la page
    window.onload = function() {
        calculerInterets();
    };
</script>

</body>
</html>
